name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type check, logic tests, build place
        run: ./scripts/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BeastValley.rbxlx
          path: build/BeastValley.rbxlx
